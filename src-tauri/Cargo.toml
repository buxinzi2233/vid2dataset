[package]
name = "vid2dataset"
version = "1.2.0"
description = "Smart video-to-image extractor for LoRA training sets (Tauri shell)"
authors = ["vid2dataset contributors"]
license = "MIT"
repository = "https://github.com/peter119lee/vid2dataset"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vid2dataset_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["io-util", "sync", "time"] }
